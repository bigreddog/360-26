name: Refresh AEMET weather
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/aemet-weather.yml
      - scripts/update_aemet_weather.py
      - scripts/aemet_alerts.py
      - scripts/publish_aemet_weather.py
      - data/weather/aemet-towns.json
      - scripts/translate_bulletins.py
      - requirements-weather-translation.txt
      - data/weather/translation-model.json
      - data/weather/curated-english-bulletins.json
permissions:
  contents: write
concurrency:
  group: aemet-weather-cache
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-weather-translation.txt
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/canarias360/marian-es-en
          key: aemet-es-en-c96e2c5399ebfae4fc43d9669556b9afa74bb69d
      - name: Install server-side translation dependencies
        continue-on-error: true
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-weather-translation.txt
      - name: Check app weather selection
        run: node tests/weather.test.js && node tests/aemet.test.js
      - name: Check numerical feed parser
        run: python -m unittest discover -s tests -p test_aemet_weather.py
      - name: Check official warning snapshots
        run: python -m unittest discover -s tests -p test_aemet_alerts.py
      - name: Check English source matching
        run: python -m unittest discover -s tests -p test_bulletin_translation.py
      - name: Restore last snapshots for failed-town retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_aemet_weather.py --download-only
      - name: Download AEMET hourly forecasts
        run: python scripts/update_aemet_weather.py
      - name: Publish weather-only JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_aemet_weather.py
      - name: Verify warning snapshot after publishing
        run: |
          python - <<'PYTEST'
          import json
          alerts = json.load(open('data/weather/aemet.json')).get('alerts', {})
          assert alerts.get('fetchedAt') and not alerts.get('error'), 'Warning update failed; original saved age retained'
          print(f"Published {len(alerts['entries'])} official warning records")
          PYTEST
      - name: Verify English bulletin coverage after publishing
        run: |
          python - <<'PY'
          import json
          data = json.load(open('data/weather/aemet.json'))
          for error in data['outlook'].get('translationErrors', []):
              print(f"{error['date']}: {error.get('reason', error['error'])}")
          assert not data['outlook'].get('translationErrors'), 'Fresh Spanish published; English translation failed'
          PY
      - name: Verify translator weather wording
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/translate_bulletins.py --smoke-test
